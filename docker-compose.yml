services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fejd-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/fejd?sslmode=disable
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: fejd
      KEYCLOAK_CLIENT_ID: fejd-backend
      KEYCLOAK_CLIENT_SECRET: EYlizeFHVtfRPhomKqasA4mgRYGLfJBL
      IMAGE_STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: fejd-images
      MINIO_USE_SSL: "false"
      # S3_REGION: eu-west-1
      # S3_ENDPOINT: ""
      # S3_ACCESS_KEY: ""
      # S3_SECRET_KEY: ""
      # S3_BUCKET: ""
      # S3_USE_SSL: "true"
    depends_on:
      - db
      - keycloak

  frontend:
    image: node:22-alpine
    container_name: fejd-frontend
    working_dir: /app
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:8080
      VITE_KEYCLOAK_URL: http://localhost:9090
      VITE_KEYCLOAK_REALM: fejd
      VITE_KEYCLOAK_CLIENT_ID: fejd-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    depends_on:
      - backend
      - keycloak

  db:
    image: postgres:16-alpine
    container_name: fejd-db
    environment:
      POSTGRES_DB: fejd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: fejd-keycloak
    command: ["start-dev", "--http-port=8080", "--db=postgres", "--db-url=jdbc:postgresql://db:5432/fejd", "--db-username=postgres", "--db-password=postgres", "--hostname-strict=false", "--hostname-debug=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/fejd
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "9090:8080"
    depends_on:
      - db
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes
      - ./keycloak/providers:/opt/keycloak/providers

  minio:
    image: minio/minio:latest
    container_name: fejd-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
