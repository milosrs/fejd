services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fejd-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/fejd?sslmode=disable
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: fejd
      KEYCLOAK_CLIENT_ID: fejd-backend
      KEYCLOAK_CLIENT_SECRET: EYlizeFHVtfRPhomKqasA4mgRYGLfJBL
      KEYCLOAK_AUDIENCES: salon-mobile,fejd-frontend
      KEYCLOAK_ADMIN_CLIENT_ID: fejd-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: H6vKp9sQ2wXrT4yL8mN1cB3dV5fG7jZ0
      INVITE_BASE_URL: http://localhost:5173
      SMTP_HOST: smtp
      SMTP_PORT: "25"
      SMTP_FROM: no-reply@fejd.local
      SUPERADMIN_NOTIFY_EMAIL: admin@fejd.local
      IMAGE_STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: fejd-images
      MINIO_USE_SSL: "false"
      # S3_REGION: eu-west-1
      # S3_ENDPOINT: ""
      # S3_ACCESS_KEY: ""
      # S3_SECRET_KEY: ""
      # S3_BUCKET: ""
      # S3_USE_SSL: "true"
    depends_on:
      - db
      - keycloak
      - smtp

  frontend:
    image: node:22-alpine
    container_name: fejd-frontend
    working_dir: /app
    environment:
      NODE_ENV: development
      VITE_API_PROXY_TARGET: http://backend:8080
      VITE_KEYCLOAK_URL: http://localhost:9090
      VITE_KEYCLOAK_REALM: fejd
      VITE_KEYCLOAK_CLIENT_ID: fejd-frontend
      VITE_GOOGLE_MAPS_API_KEY: AIzaSyCZrRxDGp_7R1vuy-o20Fa4W9gWtPEB2vo
      # Store listing URLs shown on the invite landing page when the app isn't
      # installed. Fill in once the app is published (see .kilo/plans/invite-link-qr/09-infrastructure.md).
      VITE_APP_STORE_URL: ""
      VITE_PLAY_STORE_URL: ""
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    depends_on:
      - backend
      - keycloak

  db:
    image: postgres:16-alpine
    container_name: fejd-db
    environment:
      POSTGRES_DB: fejd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: fejd-keycloak
    entrypoint: ["/bin/sh", "/opt/keycloak/startup.sh"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/fejd
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      FEJD_ADMIN_CLIENT_SECRET: H6vKp9sQ2wXrT4yL8mN1cB3dV5fG7jZ0
      SMTP_HOST: smtp
      SMTP_PORT: "25"
      SMTP_FROM: no-reply@fejd.local
    ports:
      - "9090:8080"
    depends_on:
      - db
      - smtp
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes
      - ./keycloak/providers:/opt/keycloak/providers
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/startup.sh:/opt/keycloak/startup.sh:ro

  minio:
    image: minio/minio:latest
    container_name: fejd-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  minio-init-buckets:
    image: minio/mc:latest
    container_name: fejd-minio-init-buckets
    depends_on:
      - minio
    entrypoint: >
      sh -c "
        until mc alias set myminio http://minio:9000 minioadmin minioadmin; do
          echo 'Waiting for MinIO to be ready...'
          sleep 2
        done &&
        mc mb myminio/fejd-images || true &&
        mc policy set public myminio/fejd-images || true
      "

  smtp:
    build:
      context: ./deploy/smtp
      dockerfile: Dockerfile
    container_name: fejd-smtp
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "1025:25"
    volumes:
      - smtpdata:/var/mail

volumes:
  pgdata:
  miniodata:
  smtpdata:
