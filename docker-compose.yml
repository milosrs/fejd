services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fejd-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/fejd?sslmode=disable
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: fejd
      KEYCLOAK_CLIENT_ID: fejd-backend
      KEYCLOAK_CLIENT_SECRET: EYlizeFHVtfRPhomKqasA4mgRYGLfJBL
      KEYCLOAK_AUDIENCES: salon-mobile,fejd-frontend
      KEYCLOAK_ADMIN_CLIENT_ID: fejd-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: H6vKp9sQ2wXrT4yL8mN1cB3dV5fG7jZ0
      FEJD_BACKEND_CLIENT_SECRET: EYlizeFHVtfRPhomKqasA4mgRYGLfJBL
      INVITE_BASE_URL: http://localhost:5173
      SMTP_HOST: smtp
      SMTP_PORT: "25"
      SMTP_FROM: no-reply@fejd.local
      SUPERADMIN_NOTIFY_EMAIL: admin@fejd.local
      IMAGE_STORAGE_BACKEND: s3
      S3_REGION: us-east-1
      S3_ENDPOINT: seaweedfs:8333
      S3_ACCESS_KEY: fejd_dev
      S3_SECRET_KEY: fejd_dev_secret
      S3_BUCKET: fejd-images
      S3_USE_SSL: "false"
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      - db
      - keycloak
      - smtp
      - seaweedfs-init-buckets

  frontend:
    image: node:22-alpine
    container_name: fejd-frontend
    working_dir: /app
    environment:
      NODE_ENV: development
      VITE_API_PROXY_TARGET: http://backend:8080
      VITE_KEYCLOAK_URL: http://localhost:9090
      VITE_KEYCLOAK_REALM: fejd
      VITE_KEYCLOAK_CLIENT_ID: fejd-frontend
      # Store listing URLs shown on the invite landing page when the app isn't
      # installed. Fill in once the app is published (see .kilo/plans/invite-link-qr/09-infrastructure.md).
      VITE_APP_STORE_URL: ""
      VITE_PLAY_STORE_URL: ""
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    depends_on:
      - backend
      - keycloak

  db:
    image: postgres:16-alpine
    container_name: fejd-db
    environment:
      POSTGRES_DB: fejd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: fejd-keycloak
    entrypoint: ["/bin/sh", "/opt/keycloak/startup.sh"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/fejd
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      FEJD_ADMIN_CLIENT_SECRET: H6vKp9sQ2wXrT4yL8mN1cB3dV5fG7jZ0
      SMTP_HOST: smtp
      SMTP_PORT: "25"
      SMTP_FROM: no-reply@fejd.local
    ports:
      - "9090:8080"
    depends_on:
      - db
      - smtp
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes
      - ./keycloak/providers:/opt/keycloak/providers
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/startup.sh:/opt/keycloak/startup.sh:ro

  seaweedfs:
    image: chrislusf/seaweedfs:4.46@sha256:08d516132314207d10c8e37cbffc1f32b147d870169688734cc61c6231625b62
    container_name: fejd-seaweedfs
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mkdir -p /etc/seaweedfs &&
      printf "%s\n" "{\"identities\":[{\"name\":\"fejd-dev\",\"credentials\":[{\"accessKey\":\"$${S3_ACCESS_KEY}\",\"secretKey\":\"$${S3_SECRET_KEY}\"}],\"actions\":[\"Admin\"]}]}" > /etc/seaweedfs/s3.json &&
      exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    environment:
      S3_ACCESS_KEY: fejd_dev
      S3_SECRET_KEY: fejd_dev_secret
    ports:
      - "8333:8333"
    volumes:
      - seaweedfsdata:/data
    restart: unless-stopped

  seaweedfs-init-buckets:
    image: amazon/aws-cli:2.27.41@sha256:bc6b7bba44ce38f9604ede49c584824af919047ea03fbcc7c7610671fdef95d8
    container_name: fejd-seaweedfs-init-buckets
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: fejd_dev
      AWS_SECRET_ACCESS_KEY: fejd_dev_secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until aws s3api head-bucket --bucket fejd-images --endpoint-url http://seaweedfs:8333 >/dev/null 2>&1; do
        aws s3api create-bucket --bucket fejd-images --endpoint-url http://seaweedfs:8333 >/dev/null 2>&1 || true;
        sleep 2;
      done

  smtp:
    build:
      context: ./deploy/smtp
      dockerfile: Dockerfile
    container_name: fejd-smtp
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "1025:25"
    volumes:
      - smtpdata:/var/mail

volumes:
  pgdata:
  seaweedfsdata:
  smtpdata:
